[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r740-ai-factory-community"
version = "0.2.0"
description = "Installable local AI control plane with authenticated OpenAI-compatible chat"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
dependencies = []

[project.scripts]
r740-ai-factory = "r740_factory.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r740_factory = ["static/*"]
