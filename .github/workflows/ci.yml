name: community-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Package audit
        run: python tests/package_audit.py
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Source import and SBOM tests
        run: |
          python tests/source_import_test.py
          python tests/sbom_test.py
          python tests/portal_installer_test.py
          python tests/core_installer_test.py
          python tests/model_unit_renderer_test.py
          python tests/dependency_sbom_test.py
          SOURCE_DATE_EPOCH=0 python scripts/generate-sbom.py --output dist/source-sbom.spdx.json
          SOURCE_DATE_EPOCH=0 python scripts/generate-dependency-sbom.py --output dist/dependencies.cdx.json
      - name: Shell syntax
        run: bash -n scripts/first-run.sh scripts/install-systemd.sh scripts/doctor.sh scripts/uninstall-systemd.sh
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local configuration
        run: ./scripts/first-run.sh
      - name: Verify local-only first-run material
        run: |
          test -s secrets/admin_token
          test -s secrets/setup_token
          test -f config/runtime.env
          test -f config/portal.env
          test "$(stat -c %a secrets/setup_token)" = 600
      - name: Validate Compose
        run: |
          docker compose --profile cpu config --quiet
          docker compose --profile portal config --quiet
      - name: Build CPU image
        run: |
          docker compose --profile cpu build
          docker compose --profile portal build

  auxiliary-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools test dependencies
        run: python -m pip install -r services/tools/requirements.lock
      - name: Parser authentication smoke
        run: python services/parser/tests/test_smoke.py
      - name: Tools SSRF and read-only contracts
        env:
          PYTHONPATH: services/tools/src
        run: python services/tools/tests/test_ai_tools.py
      - name: Sandbox fail-closed contract
        run: python services/sandbox/tests/test_delete_contract.py

  application-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and portal test dependencies
        run: python -m pip install -r components/core/requirements.txt -r components/portal/requirements-test.txt
      - name: Core invariants and real POSIX lock
        env:
          PYTHONPATH: src
        working-directory: components/core
        run: python -m unittest discover -s tests
      - name: Portal contracts and fail-closed configuration
        env:
          PYTHONPATH: src
        working-directory: components/portal
        run: python -m pytest -q

  local-mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies
        working-directory: clients/local-mcp
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Local-MCP tests
        working-directory: clients/local-mcp
        run: python -m unittest discover -s tests
