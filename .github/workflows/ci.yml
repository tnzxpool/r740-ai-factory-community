name: community-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Package audit
        run: python tests/package_audit.py
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Shell syntax
        run: bash -n scripts/first-run.sh scripts/install-systemd.sh scripts/doctor.sh scripts/uninstall-systemd.sh
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local configuration
        run: ./scripts/first-run.sh
      - name: Validate Compose
        run: docker compose --profile cpu config --quiet
      - name: Build CPU image
        run: docker compose --profile cpu build
