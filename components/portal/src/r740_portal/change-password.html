<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambio password · R740 AI Factory</title><style>
:root{color-scheme:dark;--bg:#07110f;--panel:#0f1f1b;--line:rgba(149,245,195,.18);--text:#edf9f2;--muted:#9bb9aa;--mint:#79e6af;--bad:#ff9c91}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(43,150,104,.23),transparent 34rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.card{width:min(460px,calc(100% - 28px));padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(15,31,27,.94);box-shadow:0 24px 70px #0007}h1{margin:0 0 6px;font-size:25px}.muted{color:var(--muted);font-size:13px}label{display:block;margin:18px 0 6px;color:var(--muted)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#06100d;color:var(--text);font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:13px;background:var(--mint);color:#062117;font-weight:850;cursor:pointer}.error{min-height:24px;margin-top:12px;color:var(--bad)}
</style></head><body><main class="card"><h1>Scegli la tua password</h1><div class="muted">Al primo accesso la password temporanea deve essere sostituita. Dopo il cambio dovrai accedere di nuovo.</div><form id="form"><label for="current">Password temporanea o attuale</label><input id="current" type="password" autocomplete="current-password" required><label for="next">Nuova password (minimo 12 caratteri)</label><input id="next" type="password" autocomplete="new-password" required><label for="confirm">Conferma nuova password</label><input id="confirm" type="password" autocomplete="new-password" required><button type="submit">Cambia password</button><div id="error" class="error"></div></form></main><script>
let me;async function start(){const r=await fetch('/api/me');if(!r.ok){location.href='/login';return}me=await r.json()}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error'),current=document.getElementById('current').value,next=document.getElementById('next').value,confirm=document.getElementById('confirm').value;error.textContent='';if(next!==confirm){error.textContent='Le nuove password non coincidono';return}try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':me.csrf_token},body:JSON.stringify({current_password:current,new_password:next})}),d=await r.json();if(!r.ok)throw new Error(d.detail||'Cambio password non riuscito');location.href='/login'}catch(x){error.textContent=x.message}});start();
</script></body></html>
