<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurazione Admin</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07110f;color:#edf9f2;font:15px system-ui}.card{width:min(500px,calc(100% - 30px));padding:28px;background:#0f1f1b;border:1px solid #29483c;border-radius:20px}h1{margin-top:0}label{display:block;margin:15px 0 6px;color:#9bb9aa}input{width:100%;box-sizing:border-box;padding:12px;background:#06100d;color:#edf9f2;border:1px solid #29483c;border-radius:10px}button{width:100%;margin-top:20px;padding:13px;background:#79e6af;color:#062117;border:0;border-radius:10px;font-weight:800}.error{color:#ff9c91;margin-top:12px}</style></head><body><main class="card"><h1>Attivazione amministratore</h1><p>Questa pagina funziona soltanto dalla rete amministrativa configurata e una sola volta.</p><form id="form"><label>Token di configurazione</label><input id="token" type="password" required><label>Nome Admin</label><input id="user" autocomplete="username" required><label>Password Admin (minimo 12 caratteri)</label><input id="pass" type="password" autocomplete="new-password" required><label>Conferma password</label><input id="confirm" type="password" autocomplete="new-password" required><button>Crea amministratore</button><div id="error" class="error"></div></form></main><script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error'),tokenValue=document.getElementById('token').value,userValue=document.getElementById('user').value,passwordValue=document.getElementById('pass').value,confirmValue=document.getElementById('confirm').value;err.textContent='';if(passwordValue!==confirmValue){err.textContent='Le password non coincidono';return}try{const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tokenValue,username:userValue,password:passwordValue})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Configurazione non riuscita');location.href=d.redirect||'/admin'}catch(x){err.textContent=x.message}});
</script></body></html>
